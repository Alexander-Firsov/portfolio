# ==============================================================================
# ПРОЕКТ: HASH2FILE (Веб-портал)
# АРХИТЕКТУРА: Docker Swarm (Перенесено после перманентных поломок Synology Web Services)
#
# КОМАНДА ЗАПУСКА: sudo docker stack deploy -c docker-compose.yml h2f
# КОМАНДА УДАЛЕНИЯ: sudo docker stack rm h2f

# КОММЕНТАРИЙ: Данная версия является одной из ранних альфа-версий,
# поддерживается исключительно чтобы поисковики не переводили статус сайта в
# "все полностью нерабочее". Бета была доступна на внутреннем адресе в локальной
# сети, но на текущий момент проект на паузе в связи с переосмыслением концепции.
# ==============================================================================

services:
  django:
    image: h2f_django:latest
    # Swarm ИГНОРИРУЕТ build. Собирать руками: docker compose build --no-cache django
    build: ./django
    command: /usr/src/hash2file/django/.venv/bin/gunicorn hash2file.wsgi:application --bind 0.0.0.0:8000 --threads 3 --timeout 120
    # пока реплика только одна и крутится на nas, удобнее прокидывать директории
    volumes:
      - /volume1/docker/hash2file2/django:/usr/src/hash2file/django
      - /volume1/docker/hash2file2/.bash_completion:/home/django/.bash_completion
      - /volume1/docker/hash2file2/f:/f
    expose:
      - 8000
    env_file:
      - ./.env.django
    depends_on:
      - db  # В Swarm работает только как порядок запуска, расширенные condition (healthy) тут не поддерживаются
    
    #  пока для отладки так (для подключения внутри контейнера avfs), потом
    #  вынести в отдельный контейнер рекурсивное подключение огромных архивов
    #  Почему так: хочется подключать по NFS, но с условием недоверия локальной
    #  сети. Поэтому нужен NFS с шифрованным трафиком.
    #  Для NFS с шифрованным трафиком хорошо бы развернуть FreeIPA, но на данном
    #  железе (NAS) это оверкилл. Поэтому, пока все риски стянуты в 1 контейнер.
    # cap_add:  # пока отключил, т.к. в этой версии проверка на архивы не реализована
      #- SYS_ADMIN
      # - ALL
    networks:
      - default
      - public-ingress
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager # Жестко вяжем к NAS, так как используем локальные папки /volume1


  db:
    image: postgres:17.4-alpine
    volumes:
      - /volume1/docker/hash2file2/postgres:/var/lib/postgresql/data/
    env_file:
      - ./.env.db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    networks:
      - default
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager  # т.к. используем /volume1

  nginx:
    image: h2f_nginx:latest
    build: ./nginx
    # ports:          # Больше не выставляем порт наружу, Traefik найдет контейнер внутри сети
    #   - 8001:80
    depends_on:
      - django
    volumes:
        - /volume1/docker/hash2file2/nginx/nginx.conf:/etc/nginx/conf.d/nginx.conf
        - /volume1/docker/hash2file2/django/staticfiles:/home/app/django/staticfiles
        - /volume1/docker/hash2file2/django/mediafiles:/home/app/django/mediafiles
    networks:
      - default
      - public-ingress  # Нужна, чтобы внешний Traefik мог достучаться до этого Nginx
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      labels:
        - "traefik.enable=true"
        
        # 1. Существующая рабочая конфигурация для HTTP
        - "traefik.http.routers.h2f.rule=Host(`hash2file.com`)"
        - "traefik.http.routers.h2f.entrypoints=web"
        - "traefik.http.routers.h2f.middlewares=h2f-redirect"
        
        # 2. Роутер для HTTPS (Авто-выпуск сертификатов через SSL-резолвер Traefik)(порт 443 -> 8443)
        - "traefik.http.routers.h2f-ssl.rule=Host(`hash2file.com`)"
        - "traefik.http.routers.h2f-ssl.entrypoints=websecure"
        - "traefik.http.routers.h2f-ssl.tls=true"
        - "traefik.http.routers.h2f-ssl.tls.certresolver=le-ssl" # Включаем Let's Encrypt
        
        # 3. Описание самого Middleware (перенаправляет любой трафик на схему https)
        - "traefik.http.middlewares.h2f-redirect.redirectscheme.scheme=https"
        - "traefik.http.middlewares.h2f-redirect.redirectscheme.permanent=true" # Дает честный 301 редирект
        
        # Единый порт бэкенда для обоих роутеров
        - "traefik.http.services.h2f.loadbalancer.server.port=80"

networks:
  # Внешняя overlay-сеть, в которой живет глобальный Traefik на Synology
  public-ingress:
    external: true

  # Локальная overlay-сеть стека для изоляции внутренних коммуникаций (Django <-> DB <-> Nginx)
  default:
    driver: overlay

